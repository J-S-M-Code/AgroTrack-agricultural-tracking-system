# ===============================
# CONFIGURACIÓN DE BASE DE DATOS
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/agrotrack_db
spring.datasource.username=agrotrack_user
spring.datasource.password=agrotrack2027
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURACIÓN DE HIBERNATE & JPA
# ===============================
# Dialecto específico para soportar polígonos y puntos con PostGIS
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect

# Permite a Hibernate crear las tablas automáticamente en desarrollo (update)
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola para debuggear
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
server.port=8080
server.servlet.context-path=/api

# ===============================
# CONFIGURACIÓN DE MINIO (STORAGE)
# ===============================
minio.url=http://localhost:9000
minio.access.key=agrotrack_admin
minio.secret.key=agrotrack2027
minio.bucket.name=agrotrack-files