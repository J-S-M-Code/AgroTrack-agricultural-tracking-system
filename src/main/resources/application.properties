# ===============================
# CONFIGURACION DE BASE DE DATOS
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/agrotrack_db
spring.datasource.username=agrotrack_user
spring.datasource.password=agrotrack2027
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURACION DE HIBERNATE & JPA
# ===============================
# Dialecto especifico para soportar poligonos y puntos con PostGIS
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect

# Permite a Hibernate crear las tablas automaticamente en desarrollo (update)
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola para debuggear
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.springframework.security=INFO

